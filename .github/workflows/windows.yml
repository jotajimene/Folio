name: Compilar Folio para Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run herramientas
      - name: Compilar
        shell: bash
        run: npx electron-builder --win portable nsis --x64 --publish never 2>&1 | tee compilacion.log; exit ${PIPESTATUS[0]}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder
      - name: Guardar el registro si falla
        if: failure()
        shell: bash
        run: |
          git config user.name "folio-ci"; git config user.email "ci@folio"
          git checkout --orphan registro-compilacion
          git rm -rfq --cached . ; git add -f compilacion.log
          git commit -qm "Registro de la compilación fallida"
          git push -f origin registro-compilacion
      - uses: actions/upload-artifact@v4
        with:
          name: Folio-Windows
          path: |
            dist/*.exe
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: folio-${{ github.run_number }}
          name: Folio · compilación ${{ github.run_number }}
          body: "Folio para Windows. Folio-…-portatil.exe se abre con doble clic; Folio-…-instalador.exe lo instala con acceso directo."
          make_latest: true
          files: dist/*.exe
