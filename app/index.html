<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Folio</title>
<link rel="stylesheet" href="css/fuentes-libro.css">
<link rel="stylesheet" href="css/folio.css">
<link rel="stylesheet" href="css/etapas.css">
</head>
<body>
<canvas class="papel" aria-hidden="true"></canvas>

<header class="cab">
  <a class="marca" href="#" aria-label="Folio" data-accion="inicio"><img src="img/f.png" alt=""><span aria-hidden="true">olio</span></a>
  <div class="proyecto"><b id="titulo-proyecto">Libro sin título</b><small id="estado-guardado">Sin guardar en disco</small></div>
  <div class="acciones">
    <button class="boton chico" data-accion="deshacer" id="b-deshacer" title="Deshacer (Ctrl+Z)" disabled>↶</button>
    <button class="boton chico" data-accion="rehacer" id="b-rehacer" title="Rehacer (Ctrl+Y)" disabled>↷</button>
    <button class="boton" data-accion="archivo" title="Los grabados originales y su procedencia">Archivo de grabados</button>
    <button class="boton" data-accion="sortear" title="Sortear otras criaturas">↻ Bestiario</button>
    <button class="boton" data-accion="concentracion" aria-pressed="false">Concentración</button>
    <button class="boton" data-accion="estanteria" title="Tus libros">Estantería</button>
    <button class="boton taco" data-accion="guardar">Guardar</button>
  </div>
</header>

<nav class="camino" aria-label="Etapas del libro"></nav>
<div class="cenefa" aria-hidden="true"></div>
<div class="prensa" aria-hidden="true"></div>

<div class="bestiario-fondo" aria-hidden="true"></div>
<main class="mesa" aria-live="polite"></main>
<div class="bestiario" aria-hidden="true"></div>

<section class="archivo-capa" hidden aria-label="Archivo de grabados"></section>
<div class="modal-capa" hidden></div>
<div class="avisos-flotantes" aria-live="polite"></div>
<input type="file" id="entrada-archivo" hidden multiple accept=".docx,.odt,.pdf,.rtf,.txt,.md,.markdown,.html,.htm,.png,.jpg,.jpeg,.webp,.bmp">
<input type="file" id="entrada-imagen" hidden accept=".png,.jpg,.jpeg,.webp">

<script src="vendor/jszip.min.js"></script>
<script src="vendor/herramientas.js"></script>
<script src="js/criaturas.js"></script>
<script src="js/modelo.js"></script>
<script src="js/archivo-datos.js"></script>
<script src="js/perfil.js"></script>
<script src="js/importar.js"></script>
<script src="js/libro.js"></script>
<script src="js/cubiertas.js"></script>
<script src="js/plan-imposicion.js"></script>
<script src="js/epub.js"></script>
<script src="js/bestiario.js"></script>
<script src="js/app.js"></script>
<script src="js/asistente.js"></script>
<script src="js/etapa-manuscrito.js"></script>
<script src="js/etapa-revision.js"></script>
<script src="js/etapa-datos.js"></script>
<script src="js/etapa-interior.js"></script>
<script src="js/etapa-cubierta.js"></script>
<script src="js/etapa-impresion.js"></script>
<script src="js/etapa-costo.js"></script>
<script src="js/archivo.js"></script>
<script src="js/hojear.js"></script>
<script src="js/imagenes.js"></script>
<script src="js/versiones.js"></script>
<script src="js/voz.js"></script>
<script src="js/corrector.js"></script>
<script src="js/indice-analitico.js"></script>
<script src="js/librojuego.js"></script>
<script src="js/tipografias.js"></script>
<script src="js/estanteria.js"></script>
<script src="js/inicio.js"></script>
</body>
</html>
